services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dgtal_economy
      POSTGRES_USER: dgtal
      POSTGRES_PASSWORD: dgtal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://dgtal:dgtal@db:5432/dgtal_economy
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    env_file:
      - .env.example
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
